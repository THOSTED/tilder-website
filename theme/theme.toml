# The theme's own words and colours, in English. A site overrides any of
# them in its content/site.toml; theme.fr.toml holds the French.

[search]
label = "Search the documentation"     # the search field's label (search.js)
placeholder = "search"                 # the field's placeholder
none = "No page matches."              # a search that finds nothing
count = "Pages found: {n}"             # {n}: how many pages match

[doc]
contents = "Documentation"             # the sidebar's summary on small screens
on_this_page = "On this page"          # the right column, over the [TOC]

[share]                                # the link preview and the browser UI
theme_color = "#00707e"
background_color = "#fcfcfa"
text_color = "#1c1e21"
muted_color = "#4f565d"
rule_color = "#d4d4cd"

# tilder's build.py --check (tilder docs/theme.md, "Checking a theme"):
# every class of the contract is styled, and the colour pairs that carry
# text reach WCAG AA (4.5:1, tilder's default contrast_min) in the light
# and the dark scheme. The accent is also the focus outline, and text
# (links) too. README.md, "Contrast", is --check --markdown's table.
[check]
contrast = [
	["--text", "--bg"], ["--text", "--surface"],
	["--muted", "--bg"], ["--muted", "--surface"],
	["--faint", "--bg"], ["--faint", "--surface"],
	["--accent", "--bg"], ["--accent", "--surface"],
	["--info", "--bg"], ["--info", "--surface"],
	["--warning", "--bg"], ["--warning", "--surface"],
	["--error", "--bg"], ["--error", "--surface"],
]

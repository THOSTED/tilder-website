# The theme's fixture site: every layout, type and class of the theme, in
# two languages. English, neutral; no real person or site.

[site]
name = "fixture docs"
url = "https://docs.example"
lang = "en"
locale = "en_GB"
languages = ["en", "fr"]
manual = "Fixture Manual"
updated = 2026-09-01
title_suffix = " - fixture docs"

[footer]
left = "FIXTURE"
